<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Word document samples · OnoDocs</title><link rel="stylesheet" href="style.css"></head>
<body><div class="controls"><header class="toolbar"><span id="viewer-controls" class="actions" hidden><button id="open-document" aria-label="Open Word file"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 8V6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v1M3 8h18l-2 10H5L3 8Z"/></svg><span>Open file</span></button><input id="local-file" type="file" accept=".docx,.docm,.dotx,.dotm" hidden><button id="download-page" aria-label="Download page 1 PNG" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><span>Save PNG</span></button><button data-save-pdf disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M12 11v7m-3-3 3 3 3-3"/></svg><span>Save PDF</span></button></span><span id="template-controls" class="actions" hidden><select id="template-data" aria-label="Booking data"><option value="offsite">Team offsite</option><option value="launch">Product launch</option></select><button id="fill-template" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4H5v16h14v-9M8 9h3m-3 4h3m-3 4h7M16 3l5 5m-2-7 4 4-9 9-4 1 1-4 8-8Z"/></svg><span>Fill template</span></button><button data-save-pdf disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M12 11v7m-3-3 3 3 3-3"/></svg><span>Save PDF</span></button></span><a class="source-link" href="https://github.com/onodocs/onodocs/tree/main/examples/sdk" target="_blank" rel="noopener">Source on GitHub</a></header>
<output id="feedback" aria-live="polite" hidden></output></div>
<div id="loading"><p id="status" role="status">Opening document…</p><button id="cancel-loading" hidden>Cancel</button></div><main id="document-viewport" aria-label="Document pages"><div id="document-view"></div></main>
<template id="form-controls"><input id="client-approval" type="checkbox" class="approval-checkbox" aria-label="Client approval"><input id="approval-date" class="cell-input" aria-label="Approval date"><button id="save-form">Submit dates</button></template>
<template id="delivery-input"><input class="cell-input" aria-label="Delivery date"></template>
<dialog id="dates-dialog" aria-labelledby="dates-title"><h2 id="dates-title" tabindex="-1" autofocus>Submitted dates</h2><p id="form-feedback"></p><pre id="dates-json"></pre><form method="dialog"><button>Close</button></form></dialog><script type="module" src="document.js"></script></body></html>
