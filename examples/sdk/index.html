<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Word document samples · OnoDocs</title><link rel="stylesheet" href="style.css"></head>
<body><div class="controls"><header class="toolbar"><span id="viewer-controls" class="actions" hidden><button id="open-document">Open Word file</button><input id="local-file" type="file" accept=".docx" hidden><select id="zoom" aria-label="Zoom"><option value="fit-page">Fit page</option><option value="fit-width">Fit width</option><option value="1">100%</option><option value="1.25">125%</option></select><button id="download-page" aria-label="Download page 1 PNG" disabled>Save PNG</button></span><span id="template-controls" class="actions" hidden><select id="template-data" aria-label="Booking data"><option value="offsite">Team offsite</option><option value="launch">Product launch</option></select><button id="fill-template" disabled>Fill template</button><button id="print-document" disabled>Print / PDF</button></span></header>
<output id="feedback" aria-live="polite" hidden></output></div>
<p id="status" role="status">Opening document…</p><main id="document-viewport" aria-label="Document pages"><div id="document-view"></div></main>
<template id="form-controls"><input id="client-approval" type="checkbox" class="approval-checkbox" aria-label="Client approval"><input id="approval-date" class="cell-input" aria-label="Approval date"><button id="save-form">Submit dates</button></template>
<template id="delivery-input"><input class="cell-input" aria-label="Delivery date"></template>
<dialog id="dates-dialog" aria-labelledby="dates-title"><h2 id="dates-title" tabindex="-1" autofocus>Submitted dates</h2><p id="form-feedback"></p><pre id="dates-json"></pre><form method="dialog"><button>Close</button></form></dialog><script type="module" src="document.js"></script></body></html>
