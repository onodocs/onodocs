<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document editor · OnoDocs</title>
  <link rel="stylesheet" href="../demo.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/svg+xml" href="/brand-mark.svg">
</head>
<body>
  <header class="demo-header"><a class="demo-brand" href="https://onodocs.com">OnoDocs</a><span class="demo-title">Document editor</span><span class="demo-note">Files stay in your browser.</span><nav class="demo-resources" aria-label="Demo resources"><a href="/examples/">All demos</a><a href="https://onodocs.com/developers/document-workflows/#editor">Integration guide</a><a href="https://github.com/onodocs/onodocs/tree/main/examples/editor" target="_blank" rel="noopener noreferrer">Source</a></nav></header>
  <div class="sample-picker"><label for="sample">Sample document</label><select id="sample"><option value="" selected disabled>Choose a sample</option><option value="report">Project report</option><option value="brief">Brand launch brief</option><option value="plan">Meeting notes</option></select><span>Open your own document or download your work from File.</span></div>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="app" aria-label="Document editor"></main>
  <script type="module" src="./main.js"></script>
</body>
</html>
