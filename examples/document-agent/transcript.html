<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent transcript</title><style>
body{max-width:1100px;margin:32px auto;padding:0 24px;background:#f5f4f1;color:#29313d;font:15px system-ui}header{display:flex;align-items:center;gap:20px}h1{margin-right:auto}button{font:inherit;padding:6px 14px}article,details,.usage{background:white;border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}img{max-width:100%;max-height:750px;object-fit:contain}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%}td,th{text-align:right;padding:8px}td:first-child,th:first-child{text-align:left}.muted{color:#657080}
